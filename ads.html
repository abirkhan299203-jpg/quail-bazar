
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বিজ্ঞাপনের তালিকা | QUAIL BAZAR</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f4;color:#222}
header{background:#176b3a;color:white;padding:20px 15px;text-align:center}
header h1{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px;gap:8px}
button{border:0;border-radius:7px;padding:11px 14px;cursor:pointer}
.lang{background:#176b3a;color:white}
.home{display:block;margin:12px;padding:12px;background:#176b3a;color:white;text-align:center;text-decoration:none;border-radius:8px}
h2{padding:0 15px}
.filters{padding:12px}
.filters input,.filters select{width:100%;padding:13px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.ads{padding:12px}
.ad,.detail{background:white;padding:16px;margin-bottom:14px;border-radius:10px;box-shadow:0 2px 6px #ddd}
.ad h3,.detail h2{margin-top:0;color:#176b3a}
.price{color:#176b3a;font-size:20px;font-weight:bold}
.contact{display:inline-block;background:#176b3a;color:white;padding:10px 15px;border-radius:7px;text-decoration:none;margin:5px 5px 0 0}
.whatsapp{background:#168b49}
.details-btn{display:block;background:#e6f3e9;color:#176b3a;padding:12px;text-align:center;text-decoration:none;border-radius:7px;margin-top:12px;font-weight:bold}
.back-btn{display:block;background:#176b3a;color:white;padding:12px;text-align:center;text-decoration:none;border-radius:7px;margin:10px 0}
.message{text-align:center;padding:20px;color:#555}
footer{text-align:center;padding:20px;color:#666}
.info{padding:10px 0;border-bottom:1px solid #eee;line-height:1.6}
.info strong{color:#176b3a}
</style>
</head>
<body>

<header>
<h1>🐦 কোয়েল বাজার</h1>
<p>QUAIL BAZAR - Bangladesh</p>
</header>

<div class="top">
<strong id="pageTitle">সকল বিজ্ঞাপন</strong>
<button class="lang" onclick="changeLang()" id="langBtn">English</button>
</div>

<a href="index.html" class="home" id="homeBtn">← হোম পেজে ফিরে যান</a>

<div id="listPage">
<h2 id="filterTitle">বিজ্ঞাপন খুঁজুন</h2>

<div class="filters">
<input type="search" id="search" placeholder="পণ্যের নাম লিখুন...">

<select id="category">
<option value="all">সকল ক্যাটাগরি</option>
<option value="live quail">জীবিত কোয়েল</option>
<option value="chicks">কোয়েল বাচ্চা</option>
<option value="eggs">কোয়েলের ডিম</option>
<option value="feed">কোয়েল খাবার</option>
<option value="equipment">খামারের সরঞ্জাম</option>
</select>

<button onclick="filterAds()" style="background:#176b3a;color:white;width:100%" id="searchBtn">🔍 খুঁজুন</button>
</div>

<h2 id="listTitle">বিজ্ঞাপনের তালিকা</h2>
<div class="ads" id="adsList">
<p class="message">বিজ্ঞাপন লোড হচ্ছে...</p>
</div>
</div>

<div id="detailPage" style="display:none;padding:12px">
<div id="detailContent">
<p class="message">বিজ্ঞাপনের বিস্তারিত লোড হচ্ছে...</p>
</div>
</div>

<footer>QUAIL BAZAR © 2026</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xvawrgfrzfgkolaetnsw.supabase.co";
const SUPABASE_KEY = "sb_publishable_fgvGkn8TpONnZtcLfsY4tg_ejqsGoRc";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let english = false;
let allAds = [];

function escapeHTML(value) {
 return String(value ?? "").replace(/[&<>"']/g, char => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[char]);
}

function categoryName(value) {
 const c = String(value || "").toLowerCase().trim();

 const names = {
  "live quail":["জীবিত কোয়েল","Live Quail"],
  "bird":["জীবিত কোয়েল","Live Quail"],
  "chicks":["কোয়েল বাচ্চা","Quail Chicks"],
  "chick":["কোয়েল বাচ্চা","Quail Chicks"],
  "eggs":["কোয়েলের ডিম","Quail Eggs"],
  "egg":["কোয়েলের ডিম","Quail Eggs"],
  "feed":["কোয়েল খাবার","Quail Feed"],
  "equipment":["খামারের সরঞ্জাম","Farm Equipment"]
 };

 return names[c] || [value || "অন্যান্য","Other"];
}

function contactButtons(ad) {
 const phone = String(ad.phone || "").replace(/[^\d+]/g,"");
 const whatsapp = String(ad.whatsapp || ad.phone || "").replace(/\D/g,"");

 return `
 ${phone ? `<a class="contact" href="tel:${escapeHTML(phone)}">${english ? "Call Seller" : "📞 ফোন করুন"}</a>` : ""}
 ${whatsapp ? `<a class="contact whatsapp" target="_blank" rel="noopener" href="https://wa.me/${escapeHTML(whatsapp)}">${english ? "WhatsApp" : "WhatsApp-এ যোগাযোগ"}</a>` : ""}
 `;
}

function renderAds(list) {
 const container = document.getElementById("adsList");

 if (!list.length) {
  container.innerHTML = `<p class="message">${
   english ? "No advertisements found." : "কোনো বিজ্ঞাপন পাওয়া যায়নি।"
  }</p>`;
  return;
 }

 container.innerHTML = list.map(ad => {
  const category = categoryName(ad.category);
  const detailsLink = `ads.html?id=${encodeURIComponent(ad.id)}`;

  return `
  <div class="ad">
   <h3>${escapeHTML(ad.product_name)}</h3>
   <p>${escapeHTML(category[english ? 1 : 0])}</p>
   <p class="price">৳ ${escapeHTML(ad.price)} / ${english ? "unit" : "প্রতি ইউনিট"}</p>
   <p>${english ? "Quantity:" : "পরিমাণ:"} ${escapeHTML(ad.quantity)}</p>
   <p>${english ? "Seller:" : "বিক্রেতা:"} ${escapeHTML(ad.farm_name)}</p>
   <p>${english ? "Location:" : "ঠিকানা:"} ${escapeHTML(ad.area)}, ${escapeHTML(ad.district)}</p>

   <a class="details-btn" href="${detailsLink}">
    ${english ? "View Full Details →" : "বিস্তারিত দেখুন →"}
   </a>
  </div>`;
 }).join("");
}

function filterAds() {
 const keyword = document.getElementById("search").value.toLowerCase().trim();
 const category = document.getElementById("category").value;

 const filtered = allAds.filter(ad => {
  const text = [
   ad.product_name,ad.farm_name,ad.district,
   ad.area,ad.description,ad.category
  ].join(" ").toLowerCase();

  const matchText = text.includes(keyword);
  const actualCategory = String(ad.category || "").toLowerCase().trim();

  const matchCategory = category === "all" ||
   actualCategory === category ||
   (category === "live quail" && actualCategory === "bird") ||
   (category === "chicks" && actualCategory === "chick") ||
   (category === "eggs" && actualCategory === "egg");

  return matchText && matchCategory;
 });

 renderAds(filtered);
}

async function showDetails(id) {
 document.getElementById("listPage").style.display = "none";
 document.getElementById("detailPage").style.display = "block";
 document.getElementById("pageTitle").innerText =
  english ? "Advertisement Details" : "বিজ্ঞাপনের বিস্তারিত";

 const content = document.getElementById("detailContent");

 const { data, error } = await db
  .from("ads")
  .select("*")
  .eq("id", id)
  .eq("status","approved")
  .maybeSingle();

 if(error || !data) {
  content.innerHTML = `<p class="message">${
   english ? "Advertisement not found." : "বিজ্ঞাপনটি পাওয়া যায়নি।"
  }</p><a class="back-btn" href="ads.html">${
   english ? "Back to Ads" : "বিজ্ঞাপনের তালিকায় ফিরে যান"
  }</a>`;
  return;
 }

 const category = categoryName(data.category);

 content.innerHTML = `
  <div class="detail">
   <h2>${escapeHTML(data.product_name)}</h2>

   <p class="price">৳ ${escapeHTML(data.price)} / ${
    english ? "unit" : "প্রতি ইউনিট"
   }</p>

   <div class="info">
    <strong>${english ? "Category:" : "ক্যাটাগরি:"}</strong>
    ${escapeHTML(category[english ? 1 : 0])}
   </div>

   <div class="info">
    <strong>${english ? "Quantity:" : "পরিমাণ:"}</strong>
    ${escapeHTML(data.quantity)}
   </div>

   <div class="info">
    <strong>${english ? "Farm / Shop Name:" : "খামার / দোকানের নাম:"}</strong>
    ${escapeHTML(data.farm_name)}
   </div>

   <div class="info">
    <strong>${english ? "District:" : "জেলা:"}</strong>
    ${escapeHTML(data.district)}
   </div>

   <div class="info">
    <strong>${english ? "Area:" : "এলাকা:"}</strong>
    ${escapeHTML(data.area)}
   </div>

   <div class="info">
    <strong>${english ? "Phone Number:" : "ফোন নম্বর:"}</strong>
    ${escapeHTML(data.phone)}
   </div>

   <div class="info">
    <strong>${english ? "WhatsApp Number:" : "WhatsApp নম্বর:"}</strong>
    ${escapeHTML(data.whatsapp)}
   </div>

   <div class="info">
    <strong>${english ? "Advertisement Details:" : "বিজ্ঞাপনের বিস্তারিত:"}</strong>
    <p>${escapeHTML(data.description)}</p>
   </div>

   <div style="margin-top:15px">
    ${contactButtons(data)}
   </div>
  </div>

  <a class="back-btn" href="ads.html">${
   english ? "← Back to All Advertisements" : "← সকল বিজ্ঞাপনে ফিরে যান"
  }</a>
 `;
}

async function loadAds() {
 const container = document.getElementById("adsList");

 const { data, error } = await db
  .from("ads")
  .select("*")
  .eq("status","approved")
  .order("created_at",{ascending:false});

 if (error) {
  console.error(error);
  container.innerHTML = `<p class="message">${
   english ? "Could not load advertisements. Please try again." :
   "বিজ্ঞাপন লোড করা যায়নি। আবার চেষ্টা করুন।"
  }</p>`;
  return;
 }

 allAds = data || [];
 filterAds();
}

document.getElementById("search").addEventListener("input",filterAds);
document.getElementById("category").addEventListener("change",filterAds);

document.getElementById("search").addEventListener("keydown",function(e){
 if(e.key === "Enter") filterAds();
});

function changeLang() {
 english = !english;

 document.getElementById("langBtn").innerText = english ? "বাংলা" : "English";
 document.getElementById("pageTitle").innerText = english ? "All Advertisements" : "সকল বিজ্ঞাপন";
 document.getElementById("homeBtn").innerText = english ? "← Back to Home" : "← হোম পেজে ফিরে যান";
 document.getElementById("filterTitle").innerText = english ? "Search Ads" : "বিজ্ঞাপন খুঁজুন";
 document.getElementById("listTitle").innerText = english ? "Advertisement List" : "বিজ্ঞাপনের তালিকা";
 document.getElementById("search").placeholder = english ? "Enter product name..." : "পণ্যের নাম লিখুন...";
 document.getElementById("searchBtn").innerText = english ? "🔍 Search" : "🔍 খুঁজুন";

 const options = document.getElementById("category").options;
 const bn = ["সকল ক্যাটাগরি","জীবিত কোয়েল","কোয়েল বাচ্চা","কোয়েলের ডিম","কোয়েল খাবার","খামারের সরঞ্জাম"];
 const en = ["All Categories","Live Quail","Quail Chicks","Quail Eggs","Quail Feed","Farm Equipment"];

 for(let i=0;i<options.length;i++) {
  options[i].text = english ? en[i] : bn[i];
 }

 const params = new URLSearchParams(window.location.search);
 const id = params.get("id");

 if(id) {
  showDetails(id);
 } else {
  filterAds();
 }
}

const params = new URLSearchParams(window.location.search);
const detailId = params.get("id");
const initialSearch = params.get("search");

if(initialSearch) {
 document.getElementById("search").value = initialSearch;
}

if(detailId) {
 showDetails(detailId);
} else {
 loadAds();
}
</script>

</body>
</html>
