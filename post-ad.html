<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>কোয়েল বাজার - বিজ্ঞাপন দিন</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f3f6f4;margin:0;padding:18px}
.container{max-width:550px;margin:auto;background:white;padding:20px;border-radius:12px}
h2{text-align:center;color:#167344}
input,select,textarea,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;font-size:16px}
button{background:#167344;color:white;border:0;border-radius:7px}
</style>
</head>
<body>
<div class="container">
<h2>🐦 কোয়েল বাজার</h2>
<h3>বিজ্ঞাপন দিন</h3>

<form id="adForm">
<select id="category" required>
<option value="">বিভাগ নির্বাচন করুন</option>
<option value="Live quail">জীবিত কোয়েল</option>
<option value="Chicks">কোয়েলের বাচ্চা</option>
<option value="Eggs">কোয়েলের ডিম</option>
<option value="Feed">কোয়েলের খাবার</option>
<option value="Equipment">খামারের সরঞ্জাম</option>
</select>

<input id="farm_name" placeholder="খামার/দোকানের নাম" required>
<input id="product_name" placeholder="পণ্যের নাম" required>
<input id="quantity" placeholder="পরিমাণ">
<input id="price" type="number" step="0.01" placeholder="একক দাম">
<input id="district" placeholder="জেলা">
<input id="area" placeholder="উপজেলা/এলাকা">
<input id="phone" placeholder="মোবাইল নম্বর" required>
<input id="whatsapp" placeholder="WhatsApp নম্বর">
<textarea id="description" placeholder="বিজ্ঞাপনের বিবরণ"></textarea>

<button type="submit" id="submitBtn">বিজ্ঞাপন জমা দিন</button>
</form>
<p id="message"></p>
<a href="index.html">হোম পেজে ফিরুন</a>
</div>

<script>
const SUPABASE_URL = "https://xvawrgfrzfgkolaetnsw.supabase.co";
sb_publishable_fgvGkn8TpONnZtcLfsY4tg_ejqsGoRc

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("adForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const message = document.getElementById("message");
  const button = document.getElementById("submitBtn");
  button.disabled = true;
  message.textContent = "জমা হচ্ছে...";

  const ad = {
    category: document.getElementById("category").value,
    farm_name: document.getElementById("farm_name").value,
    product_name: document.getElementById("product_name").value,
    quantity: document.getElementById("quantity").value,
    price: document.getElementById("price").value || null,
    district: document.getElementById("district").value,
    area: document.getElementById("area").value,
    phone: document.getElementById("phone").value,
    whatsapp: document.getElementById("whatsapp").value,
    description: document.getElementById("description").value
  };

  const {error} = await db.from("ads").insert([ad]);

  if(error){
    message.textContent = "সমস্যা হয়েছে: " + error.message;
  } else {
    message.textContent = "বিজ্ঞাপন জমা হয়েছে। অনুমোদনের অপেক্ষায় থাকবে।";
    document.getElementById("adForm").reset();
  }

  button.disabled = false;
});
</script>
</body>
</html>
